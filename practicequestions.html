<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Questions</title>
    <link rel="stylesheet" href="practiceqn.css">
</head>
<body>
    <header>
        <div class="logo">🎓 AI Study Companion</div>
        <nav>
            <button class="dashboard-btn" onclick="window.location.href='index.html'">Dashboard</button>
            <button class="logout-btn">Logout</button>
        </nav>
    </header>
    <main>
        <h1 class="heading">📚Generate Practice Questions</h1>
        <div class="upload-section">
            <h2>Upload Study Material</h2>
            <input type="file" id="fileInput" accept=".pdf, .png, .jpg, .jpeg">
            <button onclick="generateQuestions()">Generate Questions</button>
        </div>
        <div id="question-container">
            <h2>Generated Questions</h2>
            <div class="questions">
                <div class="category">
                    <h3>✅Easy Questions</h3>
                    <ul id="easy-list"></ul>
                </div>
                <div class="category">
                    <h3>⚠️Medium Questions</h3>
                    <ul id="medium-list"></ul>
                </div>
                <div class="category">
                    <h3>🔥Hard Questions</h3>
                    <ul id="hard-list"></ul>
                </div>
            </div>
        </div>
        <div class="generate-answers-section">
            <button onclick="generateAnswers()">Generate Answers</button>
            <h2>Answers</h2>
            <pre id="answers-output"></pre>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
