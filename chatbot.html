<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Companion</title>
  <link rel="stylesheet" href="css/chatbot.css" />
</head>
<body>
  <header>
    <div class="logo">🎓 AI Study Companion</div>
    <nav>
    </nav>
  </header>

  <main>
     <div class="chat-container">
      <div class="chat-header">🔍 AI Tutor</div>
      <div class="chat-box" id="chat-box">
        <div class="bot-message">Hello! How can I assist you today?</div>
      </div>
      <div class="chat-input">
        <input type="text" id="user-input" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script>
    async function sendMessage() {
      const inputElement = document.getElementById('user-input');
      const message = inputElement.value.trim();
      const chatBox = document.getElementById('chat-box');

      if (!message) return;


      const userDiv = document.createElement('div');
      userDiv.classList.add('user-message');
      userDiv.innerText = message;
      chatBox.appendChild(userDiv);

      inputElement.value = '';

 
      try {
        const response = await fetch('http://127.0.0.1:5001/ask', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ question: message })
        });

        const data = await response.json();
        const botDiv = document.createElement('div');
        botDiv.classList.add('bot-message');
        botDiv.innerText = data.answer || 'Something went wrong.';
        chatBox.appendChild(botDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (err) {
        const errorDiv = document.createElement('div');
        errorDiv.classList.add('bot-message');
        errorDiv.innerText = 'Server Error. Please try again later.';
        chatBox.appendChild(errorDiv);
      }
    }
  </script>
</body>
</html>
